[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-rpa-kit"
version = "0.1.0"
description = "Safe-by-default framework for browser automation (RPA) that writes to production: dry-run default, global write gate, read-back verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "daichiz-dev" }]
keywords = ["rpa", "automation", "playwright", "safety", "dry-run"]
dependencies = [
    "cryptography>=41",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
